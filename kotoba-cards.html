<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kotoba">
<meta name="theme-color" content="#2B4A8C">
<title>Kotoba Cards</title>
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; -webkit-text-size-adjust: 100%; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #EEF0F5;
    --card: #FFFFFF;
    --ink: #1A2038;
    --muted: #5E6580;
    --line: #D6DAE6;
    --ai: #2B4A8C;
    --ai-soft: #E3E9F6;
    --on-ai: #FFFFFF;
    --good: #3F7A4C;
    --good-soft: #E2F0E4;
    --again: #A8561C;
    --again-soft: #F7E8DC;
    --new: #B9C0D4;
    --backdrop: rgba(20, 26, 48, .42);
    --shadow: 0 1px 2px rgba(26,32,56,.06), 0 12px 32px -12px rgba(26,32,56,.18);
    --jp: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    --disp: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0F1324; --card: #181E36; --ink: #E8EBF5; --muted: #9AA2BF;
      --line: #2C3454; --ai: #8FA9E8; --ai-soft: #232D50; --on-ai: #0F1324;
      --good: #7FC08C; --good-soft: #1D3325; --again: #E8A273; --again-soft: #3A2718;
      --new: #3A4366; --backdrop: rgba(0,0,0,.6);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0F1324; --card: #181E36; --ink: #E8EBF5; --muted: #9AA2BF;
    --line: #2C3454; --ai: #8FA9E8; --ai-soft: #232D50; --on-ai: #0F1324;
    --good: #7FC08C; --good-soft: #1D3325; --again: #E8A273; --again-soft: #3A2718;
    --new: #3A4366; --backdrop: rgba(0,0,0,.6);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
  }

  html, body { height: 100%; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: var(--disp); font-size: 16px;
    padding-inline: 16px;
  }
  .app {
    max-width: 520px; margin: 0 auto; min-height: 100%;
    display: flex; flex-direction: column; gap: 30px;
    padding-block: 36px 32px;
  }

  #stage { display: flex; flex-direction: column; gap: 24px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; }
  .brand .kanji { font-family: var(--jp); font-weight: 700; color: var(--ai); }
  .count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

  .card {
    background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
    padding: 34px 30px 30px; display: flex; flex-direction: column; gap: 30px;
    border: 1px solid var(--line);
  }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
  h2.title { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }

  /* ---------- Setup ---------- */
  .section { display: flex; flex-direction: column; gap: 14px; }
  .summary { display: flex; flex-direction: column; gap: 14px; }
  .bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--new); gap: 2px; }
  .bar span { display: block; height: 100%; }
  .bar .m { background: var(--good); }
  .bar .l { background: var(--again); }
  .bar .n { background: var(--new); flex: 1; }
  .legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .legend div { display: flex; flex-direction: column; gap: 2px; }
  .legend b { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .legend span { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .options { display: grid; gap: 10px; }
  .opt {
    display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 14px;
    border: 1.5px solid var(--line); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .opt:hover { border-color: var(--ai); }
  .opt input { accent-color: var(--ai); margin: 3px 0 0; width: 18px; height: 18px; flex: none; }
  .opt:has(input:checked) { border-color: var(--ai); background: var(--ai-soft); }
  .opt:has(input:focus-visible) { outline: 2.5px solid var(--ai); outline-offset: 2px; }
  .opt strong { display: block; font-size: 16px; }
  .opt small { display: block; color: var(--muted); font-size: 14px; margin-top: 3px; line-height: 1.4; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .chip span {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px;
    border: 1.5px solid var(--line); font-size: 15px; font-weight: 600; color: var(--ink); transition: all .15s;
  }
  .chip span em { font-style: normal; font-weight: 400; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip input:checked + span { background: var(--ai); border-color: var(--ai); color: var(--on-ai); }
  .chip input:checked + span em { color: var(--on-ai); opacity: .8; }
  .chip input:focus-visible + span { outline: 2.5px solid var(--ai); outline-offset: 2px; }

  .start { display: flex; flex-direction: column; gap: 10px; }
  .primary {
    appearance: none; border: 0; border-radius: 14px; padding: 16px; font: inherit; font-weight: 700; font-size: 17px;
    background: var(--ai); color: var(--on-ai); cursor: pointer; transition: filter .15s;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:disabled { opacity: .45; cursor: default; filter: none; }
  .note { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.45; }

  .settings { display: flex; flex-direction: column; gap: 14px; font-size: 14px; color: var(--muted); }
  .settings .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .settings select { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
  .link { appearance: none; background: none; border: 0; padding: 0; font: inherit; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .link:hover { color: var(--ai); }
  .link.danger { color: var(--again); }
  .sync { font-size: 13px; }

  /* ---------- Study ---------- */
  .prompt { display: flex; flex-direction: column; gap: 14px; }
  .english { font-size: clamp(28px, 7vw, 36px); font-weight: 700; line-height: 1.1; letter-spacing: -.02em; text-wrap: balance; }
  .context { color: var(--muted); font-size: 15px; line-height: 1.45; }
  .kana { font-family: var(--jp); font-weight: 700; font-size: clamp(22px, 5.5vw, 26px); line-height: 1.3; letter-spacing: .02em; overflow-wrap: anywhere; }
  .prompt .kana { font-size: clamp(26px, 6.5vw, 32px); }
  .reading { font-family: var(--jp); font-size: 14px; color: var(--muted); margin-top: -8px; }
  .romaji-lg { font-size: 18px; font-weight: 600; color: var(--muted); }

  .reveal-btn {
    appearance: none; border: 1.5px dashed var(--line); background: transparent; color: var(--ai);
    border-radius: 14px; padding: 34px 16px; font: inherit; font-weight: 600; font-size: 16px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: background .15s, border-color .15s;
  }
  .reveal-btn:hover { background: var(--ai-soft); border-color: var(--ai); }
  .reveal-btn .hint { font-weight: 400; font-size: 13px; color: var(--muted); }

  .answer { display: flex; flex-direction: column; gap: 26px; border-top: 1px solid var(--line); padding-top: 30px; }
  .answer.enter { animation: rise .28s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .rows { display: grid; grid-template-columns: auto 1fr; gap: 16px 20px; align-items: baseline; margin: 0; }
  .rows dt { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
  .rows dd { margin: 0; min-width: 0; }
  .romaji { font-size: 20px; font-weight: 600; }

  .syl-wrap { display: flex; flex-direction: column; gap: 8px; }
  .syls { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .word { display: inline-flex; gap: 3px; flex-wrap: wrap; }
  .syl {
    appearance: none; font-family: var(--mono); font-size: 15px; color: var(--ai);
    background: var(--ai-soft); border: 1px solid transparent; border-radius: 7px;
    padding: 4px 7px; cursor: pointer; transition: border-color .12s, transform .1s;
  }
  .syl:hover { border-color: var(--ai); }
  .syl:active, .syl.speaking { transform: scale(.94); border-color: var(--ai); }
  .syl-cap { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .syl.blank { background: transparent; border: 1px dashed var(--line); color: var(--muted); cursor: default; transform: none; }

  .audio { display: flex; gap: 12px; flex-wrap: wrap; }
  .play {
    flex: 1 1 140px; appearance: none; border: 1.5px solid var(--ai); border-radius: 12px;
    padding: 12px 14px; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--ai); color: var(--on-ai); transition: transform .1s, filter .15s;
  }
  .play.slow { background: transparent; color: var(--ai); }
  .play:hover { filter: brightness(1.08); }
  .play:active { transform: scale(.98); }
  .play .speed { font-family: var(--mono); font-size: 13px; opacity: .85; }
  .play svg { width: 16px; height: 16px; flex: none; }
  .play.speaking svg .bar { animation: pulse .6s ease-in-out infinite alternate; transform-origin: center; }
  .play.speaking svg .bar:nth-child(2) { animation-delay: .2s; }
  .play.speaking svg .bar:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { from { transform: scaleY(.4); } to { transform: scaleY(1); } }
  .voice-warn { font-size: 13px; color: var(--again); line-height: 1.45; }

  .more-btn {
    appearance: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-align: left;
  }
  .more-btn:hover { border-color: var(--ai); color: var(--ai); }
  .more-btn small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .more-btn .chev { font-size: 18px; color: var(--muted); }

  .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grade button {
    appearance: none; border-radius: 12px; padding: 14px 10px; font: inherit; font-weight: 600; font-size: 15px;
    cursor: pointer; border: 1.5px solid transparent;
  }
  .btn-again { background: var(--again-soft); color: var(--again); }
  .btn-again:hover { border-color: var(--again); }
  .btn-good { background: var(--good-soft); color: var(--good); }
  .btn-good:hover { border-color: var(--good); }

  .nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .ghost {
    appearance: none; background: transparent; border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .ghost:hover { border-color: var(--ai); color: var(--ai); }

  .done { text-align: center; align-items: center; }
  .done .big { font-family: var(--jp); font-size: 36px; font-weight: 700; color: var(--ai); }
  .done p { margin: 0; color: var(--muted); line-height: 1.5; }
  .done .summary { width: 100%; text-align: left; }

  /* ---------- Drawer ---------- */
  dialog.drawer {
    margin: auto auto 0; padding: 0; border: 0; width: min(560px, 100%); max-width: 100%;
    max-height: 85vh; border-radius: 22px 22px 0 0; background: var(--card); color: var(--ink);
    box-shadow: 0 -12px 40px -12px rgba(0,0,0,.35);
  }
  dialog.drawer[open] { animation: slide .26s ease-out; }
  dialog.drawer::backdrop { background: var(--backdrop); }
  @keyframes slide { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .drawer-inner {
    padding: 14px 26px calc(30px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 26px; overflow-y: auto; max-height: 85vh; box-sizing: border-box;
  }
  .grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto; }
  .drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .drawer-head .kana { font-size: 24px; }
  .drawer-head .en { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .x { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; line-height: 1; cursor: pointer; flex: none; }
  .x:hover { border-color: var(--ai); color: var(--ai); }
  .dsec { display: flex; flex-direction: column; gap: 10px; }
  .dsec p { margin: 0; line-height: 1.55; font-size: 15px; }
  .breakdown { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; }
  .breakdown li { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 14px; padding: 12px 14px; align-items: baseline; }
  .breakdown li + li { border-top: 1px solid var(--line); }
  .breakdown .term { font-weight: 600; }
  .breakdown .term span { display: block; font-family: var(--jp); font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .breakdown .mean { color: var(--muted); font-size: 15px; line-height: 1.45; }
  .tip { font-size: 15px; line-height: 1.55; background: var(--ai-soft); border-radius: 12px; padding: 14px 16px; }

  button:focus-visible, select:focus-visible { outline: 2.5px solid var(--ai); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .answer.enter, dialog.drawer[open] { animation: none; }
    .play.speaking svg .bar { animation: none; }
  }
  @media (max-width: 420px) {
    .card { padding: 26px 20px 22px; }
    .drawer-inner { padding-inline: 20px; }
    .rows { grid-template-columns: 1fr; gap: 6px; }
    .rows dd + dt { margin-top: 12px; }
  }
</style>
</head>
<body>


<div class="app">
  <header>
    <div class="brand"><span class="kanji">言葉</span><span>Kotoba Cards</span></div>
    <span class="count" id="count"></span>
  </header>
  <main id="stage"></main>
</div>

<dialog class="drawer" id="drawer" aria-labelledby="drawer-title">
  <div class="drawer-inner" id="drawer-body"></div>
</dialog>

<script>
/* ============ Phrase data ============ */
const CATEGORIES = [
  { id: "greet", name: "Greetings & manners" },
  { id: "basics", name: "Conversation" },
  { id: "travel", name: "Transit & directions" },
  { id: "hotel", name: "Hotels" },
  { id: "shopping", name: "Shopping" },
  { id: "dining", name: "Dining" },
  { id: "help", name: "Help & health" },
  { id: "heard", name: "Things you'll hear" }
];

// Reused syllable groups
const ONEGAI = [["oh","お"],["neh","ね"],["gai","がい"],["shee","し"],["mahs","ます"]];
const KUDASAI = [["koo","く"],["dah","だ"],["sai","さい"]];
const DESU = [["dess","です"]], KA = [["kah","か"]], WA = [["wah","わ"]], O = [["oh","お"]];
const DOKO = [["doh","ど"],["koh","こ"]];

// syl: words → syllables as [shown sound, kana spoken when tapped]
// words: [romaji, Japanese, meaning]
const PHRASES = [
  /* ---------- Greetings & manners ---------- */
  {
    id: "konnichiwa", cat: "greet",
    en: "Hello.", context: "The everyday daytime greeting.",
    jp: "こんにちは", romaji: "konnichiwa",
    syl: [[["koh","こ"],["n","ん"],["nee","に"],["chee","ち"],["wah","わ"]]],
    situation: "Walking into a small shop, or greeting the front desk at your hotel in the afternoon.",
    words: [["konnichi","こんにち","today"],["wa","は","topic marker — roughly “as for today…”"]],
    tip: "The final は is read “wa”, not “ha” — a leftover from older spelling. Hold the double “n” for a beat: kon‑nichiwa."
  },
  {
    id: "ohayou", cat: "greet",
    en: "Good morning.", context: "Polite morning greeting, used until about 10–11 a.m.",
    jp: "おはようございます", romaji: "ohayō gozaimasu",
    syl: [[["oh","お"],["hah","は"],["yoh","よう"]],[["goh","ご"],["zai","ざい"],["mahs","ます"]]],
    situation: "Greeting hotel staff, a host family, or coworkers when you first see them in the morning.",
    words: [["ohayō","おはよう","early (from hayai, “early”)"],["gozaimasu","ございます","polite ending"]],
    tip: "With friends, just ohayō is fine. The line over the ō means hold that vowel a little longer."
  },
  {
    id: "konbanwa", cat: "greet",
    en: "Good evening.", context: "Evening greeting, from around sunset.",
    jp: "こんばんは", romaji: "konbanwa",
    syl: [[["kohn","こん"],["bahn","ばん"],["wah","わ"]]],
    situation: "Arriving at a restaurant or izakaya for dinner, or meeting someone in the evening.",
    words: [["konban","今晩","this evening"],["wa","は","topic marker"]],
    tip: "Like konnichiwa, the final は is read “wa”. The “n” before “b” drifts toward an “m”: kom‑ban‑wa."
  },
  {
    id: "arigatou", cat: "greet",
    en: "Thank you very much.", context: "Polite thanks — to a shopkeeper, host, or anyone who helped you.",
    jp: "ありがとうございます", romaji: "arigatō gozaimasu",
    syl: [[["ah","あ"],["ree","り"],["gah","が"],["toh","とう"]],[["goh","ご"],["zai","ざい"],["mahs","ます"]]],
    situation: "A shop assistant hands you your change and bag, or someone holds a door for you.",
    words: [["arigatō","ありがとう","thanks (from arigatai, “rare, precious”)"],["gozaimasu","ございます","polite ending"]],
    tip: "The final “u” in gozaimasu is almost silent — it ends in “mahs”, not “mah‑soo”."
  },
  {
    id: "sumimasen", cat: "greet",
    en: "Excuse me. / I'm sorry.", context: "Getting someone's attention, squeezing past, or a light apology.",
    jp: "すみません", romaji: "sumimasen",
    syl: [[["soo","す"],["mee","み"],["mah","ま"],["sen","せん"]]],
    situation: "Calling a waiter over, or edging past someone on a crowded train.",
    words: [["sumimasen","すみません","from sumu, “to be settled”, in the polite negative — roughly “this isn't settled”, i.e. I owe you"]],
    tip: "Keep every syllable short and even. In fast speech it often sounds like “suimasen”."
  },
  {
    id: "onegaishimasu", cat: "greet",
    en: "Please.", context: "A polite request — attach it to a noun to ask for that thing.",
    jp: "お願いします", reading: "おねがいします", romaji: "onegaishimasu",
    syl: [ONEGAI],
    situation: "Handing a taxi driver an address, or pointing at a menu item: “Kore, onegaishimasu.”",
    words: [["o‑","お","polite prefix"],["negai","願い","wish, request"],["shimasu","します","to do (polite)"]],
    tip: "One of the most useful phrases in Japan. The ending sounds like “shee‑mahs”."
  },
  {
    id: "daijoubu", cat: "greet",
    en: "It's okay. / No thanks.", context: "“I'm fine” — also a polite way to decline an offer.",
    jp: "大丈夫です", reading: "だいじょうぶです", romaji: "daijōbu desu",
    syl: [[["dai","だい"],["joh","じょう"],["boo","ぶ"]], DESU],
    situation: "A clerk asks if you need a bag, or someone checks you're alright after a stumble.",
    words: [["daijōbu","大丈夫","okay, all right"],["desu","です","polite “is”"]],
    tip: "With a small hand wave it means “no thanks”. Desu sounds like “dess”."
  },
  {
    id: "arigatougozaimashita", cat: "greet",
    en: "Thank you (as you leave).", context: "Past-tense thanks, once a service is finished.",
    jp: "ありがとうございました", romaji: "arigatō gozaimashita",
    syl: [[["ah","あ"],["ree","り"],["gah","が"],["toh","とう"]],[["goh","ご"],["zai","ざい"],["mahsh","まし"],["tah","た"]]],

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const settings = Object.assign({ dir: "en2jp", cats: CATEGORIES.map(c => c.id), voice: "" }, LS.get("kotoba.settings", {}));
let progress = LS.get("kotoba.progress", {}); // key "id:dir" → {box, due, t}
const saveSettings = () => LS.set("kotoba.settings", settings);
// Turn on any categories added since this browser last saved its settings
(function () {
  const saved = LS.get("kotoba.settings", null);
  const known = settings.known || (saved ? ["greet", "polite", "dining"] : CATEGORIES.map(c => c.id));
  if (settings.cats.includes("polite") && !settings.cats.includes("greet")) settings.cats.push("greet");
  settings.cats = settings.cats.filter(id => CATEGORIES.some(c => c.id === id));
  CATEGORIES.forEach(c => { if (!known.includes(c.id)) settings.cats.push(c.id); });
  settings.known = CATEGORIES.map(c => c.id);
  saveSettings();
})();

/* Sync progress to the viewer's private store when available */
let remote = null, writing = false, pendingWrite = false, saveTimer = null, syncState = "local";
function saveProgress() {
  LS.set("kotoba.progress", progress);
  if (!remote) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushRemote, 1200);
}
async function flushRemote() {
  if (!remote) return;
  if (writing) { pendingWrite = true; return; }
  writing = true;
  try { await remote.set({ cards: progress, updated: Date.now() }); syncState = "synced"; }
  catch (e) { if (e && e.code === "invalid_argument") remote = null; syncState = remote ? "synced" : "local"; }
  writing = false;
  if (pendingWrite) { pendingWrite = false; flushRemote(); }
}
async function initSync() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    const snap = await ref.get();
    let localNewer = false;
    const rc = snap.exists ? (snap.data().cards || {}) : {};
    const merged = { ...rc };
    for (const [k, v] of Object.entries(progress)) {
      if (!rc[k] || (v.t || 0) > (rc[k].t || 0)) { merged[k] = v; localNewer = true; }
    }
    progress = merged;
    LS.set("kotoba.progress", progress);
    remote = ref; syncState = "synced";
    if (localNewer) flushRemote();
    if (screen === "setup") renderSetup();
  } catch (e) { /* stay local */ }
}

/* ============ Spaced repetition ============ */
const DAY = 864e5;
const INTERVALS = [0, 1, 3, 7, 14, 30]; // days for box 0..5
const MASTERED_BOX = 4;
const key = (id, dir) => id + ":" + dir;

function stateOf(id, dir) {
  const r = progress[key(id, dir)];
  if (!r) return "new";
  return r.box >= MASTERED_BOX ? "mastered" : "learning";
}
function record(id, dir, gotIt) {
  const k = key(id, dir);
  const r = progress[k] || { box: 0 };
  const box = gotIt ? Math.min(r.box + 1, INTERVALS.length - 1) : 0;
  progress[k] = { box, due: Date.now() + INTERVALS[box] * DAY, t: Date.now() };
  saveProgress();
}
function selectedPhrases() { return PHRASES.filter(p => settings.cats.includes(p.cat)); }
function stats() {
  const s = { mastered: 0, learning: 0, new: 0, due: 0, next: Infinity };
  const now = Date.now();
  for (const p of selectedPhrases()) {
    const st = stateOf(p.id, settings.dir); s[st]++;
    const r = progress[key(p.id, settings.dir)];
    if (r) { if (r.due <= now) s.due++; else s.next = Math.min(s.next, r.due); }
  }
  return s;
}
function whenText(ts) {
  const d = ts - Date.now();
  if (d < 36e5) return "within the hour";
  if (d < DAY) return "in " + Math.round(d / 36e5) + " hours";
  const days = Math.round(d / DAY);
  return days <= 1 ? "tomorrow" : "in " + days + " days";
}
const NEW_PER_SESSION = 10;
function buildQueue(all) {
  const now = Date.now(), list = selectedPhrases();
  if (all) return shuffle(list.map(p => p.id));
  const due = list.filter(p => { const r = progress[key(p.id, settings.dir)]; return r && r.due <= now; }).map(p => p.id);
  const fresh = list.filter(p => !progress[key(p.id, settings.dir)]).map(p => p.id).slice(0, NEW_PER_SESSION);
  return shuffle(due).concat(fresh);
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ============ Speech ============ */
const synth = window.speechSynthesis;
let voices = [];
const PREFERRED = /kyoko|otoya|nanami|keita|ayumi|haruka|google 日本語|o-ren|hattori/i;
function loadVoices() {
  if (!synth) return;
  voices = synth.getVoices().filter(v => /^ja(-|_|$)/i.test(v.lang))
    .sort((a, b) => (PREFERRED.test(b.name) - PREFERRED.test(a.name)) || (b.localService - a.localService));
  if (screen === "setup") renderVoiceSelect();
  renderWarn();
}
if (synth) { synth.addEventListener?.("voiceschanged", loadVoices); setTimeout(loadVoices, 50); setTimeout(loadVoices, 600); }

function speak(text, rate, el) {
  if (!synth) return;
  synth.cancel();
  document.querySelectorAll(".speaking").forEach(b => b.classList.remove("speaking"));
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP"; u.rate = rate;
  const v = voices.find(v => v.name === settings.voice) || voices[0];
  if (v) u.voice = v;
  if (el) { el.classList.add("speaking"); const off = () => el.classList.remove("speaking"); u.onend = off; u.onerror = off; }
  synth.speak(u);
}
function renderWarn() {
  const w = document.querySelector(".voice-warn");
  if (!w) return;
  if (!synth) { w.hidden = false; w.textContent = "This browser doesn't support speech. Try Chrome, Edge or Safari."; }
  else if (!voices.length) { w.hidden = false; w.textContent = "No Japanese voice found here, so audio may be silent or wrong. Open this page in Chrome or Edge, or add a Japanese voice in your system's speech settings."; }
  else w.hidden = true;
}

  const sel = $("voice");
  if (!sel) return;
  if (!voices.length) { sel.innerHTML = "<option>No Japanese voice found</option>"; sel.disabled = true; return; }
  sel.disabled = false;
  sel.innerHTML = voices.map(v => `<option value="${esc(v.name)}" ${v.name === settings.voice ? "selected" : ""}>${esc(v.name.replace(/\s*\(.*\)$/, ""))}${v.localService ? "" : " (online)"}</option>`).join("");
  sel.onchange = e => { settings.voice = e.target.value; saveSettings(); };
}

function startSession(all) {
  queue = buildQueue(all);
  firstTry = {};
  revealed = false;
  screen = "study";
  renderCard();
}

function sylHTML(p) {
  return `<div class="syl-wrap">
    <div class="syls">${p.syl.map(w => `<span class="word">${w.map(([say, kana]) =>
      kana ? `<button class="syl" type="button" data-kana="${esc(kana)}" aria-label="Play ${esc(say)}">${esc(say)}</button>` : `<span class="syl blank" aria-label="blank">___</span>`).join("")}</span>`).join("")}</div>
    <span class="syl-cap">Tap a syllable to hear it slowly</span></div>`;
}
function audioHTML(p) {
  return `<div class="audio">
      <button class="play" id="play1" type="button">${WAVE} Listen <span class="speed">1×</span></button>
      <button class="play slow" id="play2" type="button">${WAVE} Slow <span class="speed">0.5×</span></button>
    </div>${p.sayNote ? `<div class="syl-cap">Audio example: ${esc(p.sayNote)}</div>` : ""}<div class="voice-warn" hidden></div>`;
}
function jpHTML(p) {
  return `<div class="kana" lang="ja">${esc(p.jp)}</div>${p.reading ? `<div class="reading" lang="ja">${esc(p.reading)}</div>` : ""}`;
}
const moreHTML = `<button class="more-btn" id="more" type="button"><span>More about this phrase<br><small>When to use it · word by word · tip</small></span><span class="chev" aria-hidden="true">↑</span></button>`;
const gradeHTML = `<div class="grade"><button class="btn-again" id="gAgain" type="button">Practice again</button><button class="btn-good" id="gGood" type="button">Got it</button></div>`;

function renderCard(animate) {
  if (!queue.length) return renderDone();
  const p = byId[queue[0]];
  const rev = settings.dir === "jp2en";
  $("count").textContent = `${queue.length} left`;

  const prompt = rev
    ? `<div class="prompt"><span class="eyebrow">What does this mean?</span>${jpHTML(p)}<div class="romaji-lg">${esc(p.romaji)}</div></div>${audioHTML(p)}`
    : `<div class="prompt"><span class="eyebrow">${p.cat === "heard" ? "What you'll hear for…" : "How do you say…"}</span><div class="english">${esc(p.en)}</div><div class="context">${esc(p.context)}</div></div>`;

  const answer = rev
    ? `<div class="english">${esc(p.en)}</div><div class="context" style="margin-top:-14px">${esc(p.context)}</div>
       <dl class="rows"><dt>Sounds like</dt><dd>${sylHTML(p)}</dd></dl>`
    : `${jpHTML(p)}
       <dl class="rows"><dt>Romaji</dt><dd class="romaji">${esc(p.romaji)}</dd><dt>Sounds like</dt><dd>${sylHTML(p)}</dd></dl>
       ${audioHTML(p)}`;

  $("stage").innerHTML = `
    <section class="card" aria-live="polite">
      ${prompt}
      ${!revealed
        ? `<button class="reveal-btn" id="reveal" type="button">${rev ? "Reveal the meaning" : "Reveal the Japanese"}<span class="hint">${rev ? "Say what you think it means, then check" : "Say it out loud first, then check"}</span></button>`
        : `<div class="answer ${animate ? "enter" : ""}">${answer}${moreHTML}${gradeHTML}</div>`}
    </section>
    <div class="nav">
      <button class="ghost" id="end" type="button">← End session</button>
      <button class="ghost" id="skip" type="button">Skip for now →</button>
    </div>`;

  if ($("play1")) { $("play1").onclick = e => speak(p.say || p.jp, 1, e.currentTarget); $("play2").onclick = e => speak(p.say || p.jp, 0.5, e.currentTarget); }
  document.querySelectorAll(".syl").forEach(b => b.onclick = () => speak(b.dataset.kana, 0.6, b));
  if ($("reveal")) $("reveal").onclick = reveal;
  if ($("more")) $("more").onclick = () => openDrawer(p);
  if ($("gAgain")) { $("gAgain").onclick = () => grade(false); $("gGood").onclick = () => grade(true); }
  $("end").onclick = () => { synth?.cancel(); renderSetup(); };
  $("skip").onclick = () => { queue.push(queue.shift()); revealed = false; synth?.cancel(); renderCard(); };
  renderWarn();
}

function reveal() {
  if (revealed || screen !== "study") return;
  revealed = true;
  renderCard(true);
  ($("play1") || $("gGood"))?.focus({ preventScroll: true });
}

function grade(gotIt) {
  if (!revealed) return;
  const id = queue.shift();
  if (!(id in firstTry)) firstTry[id] = gotIt;
  record(id, settings.dir, gotIt);
  if (!gotIt) queue.splice(Math.min(2, queue.length), 0, id); // comes back after two other cards
  revealed = false;
  synth?.cancel();
  renderCard();
}

function renderDone() {
  screen = "done";
  $("count").textContent = "";
  const ids = Object.keys(firstTry);
  const first = ids.filter(id => firstTry[id]).length;
  const s = stats();
  $("stage").innerHTML = `
    <section class="card done">
      <div class="big" lang="ja">おつかれさま</div>
      <p><em>otsukaresama</em> — “thanks for your hard work.”</p>
      <p>${ids.length} phrase${ids.length === 1 ? "" : "s"} studied · ${first} on the first try · ${ids.length - first} needed practice</p>
      ${summaryHTML(s)}
      <button class="primary" id="back" type="button" style="width:100%">Back to setup</button>
    </section>`;
  $("back").onclick = renderSetup;
  $("back").focus({ preventScroll: true });
}

/* ============ Drawer ============ */
const drawer = $("drawer");
function openDrawer(p) {
  $("drawer-body").innerHTML = `
    <div class="grip" aria-hidden="true"></div>
    <div class="drawer-head">
      <div><div class="kana" lang="ja" id="drawer-title">${esc(p.jp)}</div><div class="en">${esc(p.romaji)} — ${esc(p.en)}</div></div>
      <button class="x" id="close" type="button" aria-label="Close">×</button>
    </div>
    <div class="dsec"><span class="eyebrow">When you'd use it</span><p>${esc(p.situation)}</p></div>
    <div class="dsec"><span class="eyebrow">Word by word</span>
      <ul class="breakdown">${p.words.map(([t, k, m]) => `<li><div class="term">${esc(t)}<span lang="ja">${esc(k)}</span></div><div class="mean">${esc(m)}</div></li>`).join("")}</ul>
    </div>
    <div class="dsec"><span class="eyebrow">Pronunciation tip</span><div class="tip">${esc(p.tip)}</div></div>`;
  $("close").onclick = () => drawer.close();
  drawer.showModal();
  $("close").focus();
}
drawer.addEventListener("click", e => { if (e.target === drawer) drawer.close(); });
drawer.addEventListener("close", () => $("more")?.focus({ preventScroll: true }));

/* ============ Keyboard ============ */
document.addEventListener("keydown", e => {
  if (screen !== "study" || drawer.open || e.metaKey || e.ctrlKey || e.altKey) return;
  if (["INPUT", "SELECT"].includes(e.target.tagName)) return;
  if (e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return; // let the focused button act
  const p = byId[queue[0]];
  const canPlay = $("play1");
  if ((e.key === " " || e.key === "Enter") && !revealed) { e.preventDefault(); reveal(); }
  else if (e.key === "1" && canPlay) speak(p.say || p.jp, 1, $("play1"));
  else if (e.key === "2" && canPlay) speak(p.say || p.jp, 0.5, $("play2"));
  else if (e.key === "ArrowRight" && revealed) grade(true);
  else if (e.key === "ArrowLeft" && revealed) grade(false);
  else if (e.key.toLowerCase() === "m" && revealed) openDrawer(p);
});

renderSetup();
initSync();
</script>

</body>
</html>
